eturn;\n    const off    = idx - semActiveIdx;\n    const target = (off === 0) ? 'expanded'\n                 : (Math.abs(off) <= 2) ? 'compact' : 'micro';\n    if (semRendMode[idx] === target) return;\n    semRendMode[idx] = target;\n\n    const item = scroll.querySelector('[data-sem-idx=\"' + idx + '\"]');\n    if (!item) return;\n    const body = item.querySelector('.sem-week-body');\n\n    if (target === 'micro') { body.innerHTML = ''; return; }\n\n    body.innerHTML = '';\n    const grid = document.createElement('div');\n    grid.className = 'schedule-week-grid' + (target === 'compact' ? ' next-week' : '');\n    body.appendChild(grid);\n    renderWeekGrid(grid, semWeeks[idx], target === 'expanded' ? 'current' : 'next');\n  }\n\n  function refreshScheduleContent() {\n    semRendMode = {};\n    const scroll = document.getElementById('semScroll');\n    if (!scroll) return;\n    const todayMon = getWeekMonday(0);\n    scroll.querySelectorAll('.sem-week').forEach(el => {\n      const wm = semWeeks[parseInt(el.dataset.semIdx)];\n      if (wm) el.classList.toggle('is-past', wm < todayMon);\n    });\n    const wrap = scroll.querySelector('.sem-slide-wrap') || scroll;\n    for (let o = 0; o <= 2; o++) _semEnsure(wrap, semActiveIdx + o);\n    renderNextTask();\n  }\n\n  const MONTHS_LONG = ['Januar','Februar','März','April','Mai','Juni',\n                       'Juli','August','September','Oktober','November','Dezember'];\n\n  function _semMakeItem(weekMon, idx, todayMon) {\n    const item = document.createElement('div');\n    item.className = 'sem-week';\n    item.dataset.semIdx = idx;\n    if (weekMon.getTime() === todayMon.getTime()) item.classList.add('is-today-week');\n    if (weekMon < todayMon) item.classList.add('is-past');\n    // Weekend: next week is the \"active\" week — tag it so the header glows\n    if (isWeekend()) {\n      const nextMon = getWeekMonday(1);\n      if (weekMon.getTime() === nextMon.getTime()) item.classList.add('is-default-week');\n    }\n\n    const fri = new Date(weekMon); fri.setDate(weekMon.getDate() + 4);\n    const monName = MONTHS_LONG[weekMon.getMonth()];\n    const friName = MONTHS_LONG[fri.getMonth()];\n    const monthLabel = monName === friName ? monName : monName.slice(0,3) + ' / ' + friName.slice(0,3);\n\n    const hd = document.createElement('div');\n    hd.className = 'sem-week-hd';\n    hd.innerHTML =\n      '<span class=\"sem-kw\">KW ' + isoWeek(weekMon) + '<\u002Fspan>' +\n      '<span class=\"sem-dates\">' + fmtDate(weekMon) + '–' + fmtDate(fri) +\n      '<span class=\"sem-month\"> ' + monthLabel + '<\u002Fspan><\u002Fspan>';\n\n    const body = document.createElement('div');\n    body.className = 'sem-week-body';\n\n    item.appendChild(hd);\n    item.appendChild(body);\n    return item;\n  }\n\n  function _semUpdateNav() {\n    const btnPrev = document.getElementById('semBtnPrev');\n    const btnNext = document.getElementById('semBtnNext');\n    if (btnPrev) btnPrev.disabled = (semActiveIdx <= 0);\n    if (btnNext) btnNext.disabled = (semActiveIdx + 2 >= semWeeks.length - 1);\n  }\n\n  let _semAnimating = false;\n\n  function _buildSlideWrap(startIdx) {\n    const todayMon = getWeekMonday(0);\n    const wrap = document.createElement('div');\n    wrap.className = 'sem-slide-wrap';\n    semRendMode = {};\n    for (let o = 0; o <= 2; o++) {\n      const idx = startIdx + o;\n      if (idx >= semWeeks.length) break;\n      const item = _semMakeItem(semWeeks[idx], idx, todayMon);\n      item.classList.add(o === 0 ? 'is-expanded' : 'is-compact');\n      wrap.appendChild(item);\n      _semEnsure(wrap, idx);\n    }\n    return wrap;\n  }\n\n  function semShift(delta) {\n    if (_semAnimating) return;\n    const newIdx = Math.max(0, Math.min(semWeeks.length - 1, semActiveIdx + delta));\n    if (newIdx === semActiveIdx) return;\n    _semAnimating = true;\n    semActiveIdx = newIdx;\n\n    const scroll   = document.getElementById('semScroll');\n    const wrap     = scroll.querySelector('.sem-slide-wrap');\n    const todayMon = getWeekMonday(0);\n    const DUR  = 400;\n    const EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';\n    const rows = [...wrap.children]; // [expanded, compact, compact]\n\n    function clearStyle(r) {\n      if (!r) return;\n      r.style.transition = r.style.transform = r.style.opacity = '';\n    }\n\n    if (delta > 0) {\n      /* ── \"Später\": alles nach oben ────────────────────────────────────\n       * exitRow (expanded) gleitet raus,\n       * promRow (compact)  rutscht nach oben UND expandiert,\n       * stayRow (compact)  rutscht nach oben,\n       * newRow  (compact)  gleitet von unten rein.\n       * ───────────────────────────────────────────────────────────────── */\n      const [exitRow, promRow, stayRow] = rows;\n      const exitH = exitRow.offsetHeight;\n\n      // Höhe einfrieren, bevor neue Zeile hinzugefügt wird (neue Zeile bleibt geclippt)\n      scroll.style.height = scroll.offsetHeight + 'px';\n\n      // Neue compact-Zeile unten einfügen\n      const nIdx = newIdx + 2;\n      let newRow = null;\n      if (nIdx < semWeeks.length) {\n        delete semRendMode[nIdx];\n        newRow = _semMakeItem(semWeeks[nIdx], nIdx, todayMon);\n        newRow.classList.add('is-compact');\n        wrap.appendChild(newRow);\n        _semEnsure(wrap, nIdx);\n      }\n\n      // promRow auf expanded hochstufen (CSS-Transition lässt sie wachsen)\n      delete semRendMode[newIdx];\n      promRow.classList.remove('is-compact');\n      promRow.classList.add('is-expanded');\n      _semEnsure(wrap, newIdx);\n\n      // Alle Zeilen gleichzeitig nach oben verschieben\n      requestAnimationFrame(() => {\n        const T = `transform ${DUR}ms ${EASE}, opacity ${DUR}ms ease`;\n        exitRow.style.transition = T;\n        exitRow.style.transform  = `translateY(-${exitH}px)`;\n        exitRow.style.opacity    = '0';\n        promRow.style.transition = T;\n        promRow.style.transform  = `translateY(-${exitH}px)`;\n        if (stayRow) { stayRow.style.transition = T; stayRow.style.transform = `translateY(-${exitH}px)`; }\n        if (newRow)  { newRow.style.transition  = T; newRow.style.transform  = `translateY(-${exitH}px)`; }\n      });\n\n      setTimeout(() => {\n        if (wrap.contains(exitRow)) wrap.removeChild(exitRow);\n        [promRow, stayRow, newRow].forEach(clearStyle);\n        scroll.style.height = '';\n        _semUpdateNav();\n        _semAnimating = false;\n      }, DUR + 30);\n\n    } else {\n      /* ── \"Früher\": alles nach unten ───────────────────────────────────\n       * newRow  (expanded) gleitet von oben rein,\n       * demRow  (expanded) rutscht nach unten UND komprimiert,\n       * stayRow (compact)  rutscht nach unten,\n       * exitRow (compact)  gleitet unten raus.\n       * ───────────────────────────────────────────────────────────────── */\n      const [demRow, stayRow, exitRow] = rows;\n\n      // Neue expanded-Zeile oben einfügen\n      const nIdx = newIdx;\n      delete semRendMode[nIdx];\n      const newRow = _semMakeItem(semWeeks[nIdx], nIdx, todayMon);\n      newRow.classList.add('is-expanded');\n      wrap.insertBefore(newRow, wrap.firstChild);\n      _semEnsure(wrap, nIdx);\n\n      // Höhe messen (Layout hat jetzt 4 Zeilen; transform beeinflusst Layout nicht)\n      const newRowH = newRow.offsetHeight;\n\n      // Auf ursprüngliche 3-Zeilen-Höhe einfrieren\n      scroll.style.height = (scroll.offsetHeight - newRowH) + 'px';\n\n      // Alles sofort nach oben kompensieren, sodass sich für den Nutzer nichts bewegt hat\n      newRow.style.transform  = `translateY(-${newRowH}px)`;\n      newRow.style.opacity    = '0';\n      demRow.style.transform  = `translateY(-${newRowH}px)`;\n      stayRow.style.transform = `translateY(-${newRowH}px)`;\n      exitRow.style.transform = `translateY(-${newRowH}px)`;\n\n      // demRow auf compact herunterstufen\n      delete semRendMode[newIdx + 1];\n      demRow.classList.remove('is-expanded');\n      demRow.classList.add('is-compact');\n      _semEnsure(wrap, newIdx + 1);\n\n      // Alle Zeilen gleichzeitig auf ihre natürlichen Positionen animieren\n      requestAnimationFrame(() => {\n        const T = `transform ${DUR}ms ${EASE}, opacity ${DUR}ms ease`;\n        newRow.style.transition  = T; newRow.style.transform  = 'translateY(0)'; newRow.style.opacity = '1';\n        demRow.style.transition  = T; demRow.style.transform  = 'translateY(0)';\n        stayRow.style.transition = T; stayRow.style.transform = 'translateY(0)';\n        exitRow.style.transition = T; exitRow.style.transform = 'translateY(0)'; exitRow.style.opacity = '0';\n      });\n\n      setTimeout(() => {\n        if (wrap.contains(exitRow)) wrap.removeChild(exitRow);\n        [newRow, demRow, stayRow].forEach(clearStyle);\n        scroll.style.height = '';\n        _semUpdateNav();\n        _semAnimating = false;\n      }, DUR + 30);\n    }\n  }\n\n  function renderSchedule() {\n    const sem  = getCurrentSemester();\n    semWeeks   = getSemesterWeeks(sem);\n    semRendMode = {};\n\n    semActiveIdx = getDefaultWeekIdx();\n\n    const lbl = document.getElementById('semesterNameLabel');\n    if (lbl) lbl.textContent = sem.name;\n    const greetSem = document.getElementById('greetingSem');\n    if (greetSem) greetSem.textContent = sem.name;\n\n    const scroll = document.getElementById('semScroll');\n    scroll.innerHTML = '';\n    const wrap = _buildSlideWrap(semActiveIdx);\n    scroll.appendChild(wrap);\n    _semUpdateNav();\n  }\n\n  function autoResize(ta) {\n    ta.style.height = '1px';\n    ta.style.height = ta.scrollHeight + 'px';\n  }\n\n  function renderWeekGrid(gridId, monday, mode) {\n    // mode: 'current' (full detail + edit) | 'next' (compact, note only)\n    const compact = mode === 'next';\n    const grid = typeof gridId === 'string' ? document.getElementById(gridId) : gridId;\n    grid.innerHTML = '';\n\n    for (let d = 0; d < 5; d++) {\n      const date = new Date(monday);\n      date.setDate(monday.getDate() + d);\n\n      const dayEntries = schedEntries\n        .map((e, i) => ({ ...e, idx: i }))\n        .filter(e => e.day === d)\n        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));\n\n      const col = document.createElement('div');\n      const today = new Date(); today.setHours(0,0,0,0);\n      const dateNorm = new Date(date); dateNorm.setHours(0,0,0,0);\n      const isTodayCol  = isToday(date);\n      const isThisWeek  = monday.getTime() === getWeekMonday(0).getTime();\n      const isPastWeek  = monday < getWeekMonday(0); // ganze Woche liegt in der Vergangenheit\n      const todayDowCheck = (today.getDay() + 6) % 7;\n      const isPrevToday = isThisWeek && !isTodayCol && todayDowCheck > 0 && d === todayDowCheck - 1;\n      const isNextToday = isThisWeek && !isTodayCol && todayDowCheck < 4 && d === todayDowCheck + 1;\n      // Past: entweder vergangene Tage dieser Woche ODER alle Tage einer vergangenen Woche\n      const isPast = isPastWeek || (isThisWeek && dateNorm < today && !isPrevToday);\n      col.className = 'schedule-day'\n        + (isPast ? ' past' : '')\n        + (isTodayCol ? ' today-col' : '')\n        + (isPrevToday ? ' prev-today' : '')\n        + (isNextToday ? ' next-today' : '');\n      // Reihenfolge für Mobile-Hochformat: heute = 0, kommende Tage darunter (1,2…),\n      // vergangene Tage chronologisch darüber (negativ)\n      let dayOrder = d;\n      if (isThisWeek) dayOrder = d - todayDowCheck;\n      col.style.setProperty('--day-order', dayOrder);\n      const numClass = isTodayCol ? 'schedule-day-num today' : 'schedule-day-num';\n      col.innerHTML = `\n        <div class=\"schedule-day-header\">\n          <span class=\"schedule-day-name\">${DAY_SHORT[d]}<\u002Fspan>\n          <span class=\"${numClass}\">${date.getDate()}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"schedule-events\"><\u002Fdiv>\n      `;\n      grid.appendChild(col);\n      const eventsEl = col.querySelector('.schedule-events');\n\n      if (dayEntries.length === 0) {\n        eventsEl.innerHTML = '<div style=\"height:10px;\"><\u002Fdiv>';\n        continue;\n      }\n\n      dayEntries.forEach(entry => {\n        const color      = entry.color || DEFAULT_SCHED_COLOR;\n        const timeStr    = entry.startTime\n          ? (entry.endTime ? entry.startTime + '–' + entry.endTime : entry.startTime)\n          : '';\n        const roomStr    = entry.room ? ' (' + entry.room + ')' : '';\n        const nKey       = noteKey(monday, d, entry.idx);\n        const noteVal    = schedNotes[nKey] || '';\n        // Für diesen Tag entfernte (oder alt-abgesagte) Termine werden nicht angezeigt\n        if (removedSlots[nKey] || cancelledSlots[nKey]) return;\n\n        /* ── Event row ── */\n        const ev = document.createElement('div');\n        ev.className = 'sched-event';\n        ev.style.alignItems = 'flex-start';\n        ev.style.cursor = 'pointer';\n        ev.style.background = color;\n        ev.title = 'Klicken für Optionen';\n\n        ev.addEventListener('click', (e) => {\n          e.stopPropagation();\n          showEvtChoice(entry.idx, nKey, monday, d);\n        });\n\n        ev.innerHTML = `\n            <div class=\"sched-event-bar\" style=\"background:${color};margin-top:3px;\"><\u002Fdiv>\n            <div class=\"sched-event-text\" style=\"flex:1;min-width:0;\">\n              <strong>${entry.course}<\u002Fstrong>${compact ? '' : roomStr}\n              ${(!compact && timeStr) ? '<br><span class=\"sched-ev-time\">' + timeStr + '<\u002Fspan>' : ''}\n            <\u002Fdiv>\n            ${!compact ? `<div style=\"display:flex;gap:3px;align-items:center;flex-shrink:0;\">\n              <button class=\"note-open-btn\" title=\"Notiz hinzufügen\"\n                style=\"background:rgba(255,255,255,0.15);border:0.5px solid rgba(255,255,255,0.4);color:rgba(255,255,255,0.85);\n                       font-size:11px;cursor:pointer;padding:1px 5px;flex-shrink:0;line-height:1.4;\n                       border-radius:4px;transition:all 0.15s;${noteVal ? 'display:none;' : ''}\"\n                onmouseover=\"this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.8)';\"\n                onmouseout=\"this.style.color='rgba(255,255,255,0.85)';this.style.borderColor='rgba(255,255,255,0.4)';\">✏<\u002Fbutton>\n            <\u002Fdiv>` : ''}\n          `;\n        eventsEl.appendChild(ev);\n\n        /* ── Note area (always, both weeks) ── */\n        const wrapper = document.createElement('div');\n        const isDone = noteCompleted[nKey] || false;\n        wrapper.style.cssText = `display:${noteVal ? 'block' : 'none'};margin:2px 8px 6px 17px;overflow:hidden;`;\n\n        // ── check row ──\n        const checkRow = document.createElement('div');\n        checkRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:3px;';\n        const checkBtn = document.createElement('button');\n        checkBtn.title = isDone ? 'Wieder öffnen' : 'Als erledigt markieren';\n        checkBtn.style.cssText = `flex-shrink:0;width:14px;height:14px;border-radius:3px;\n          border:1px solid ${color};background:${isDone ? color : 'none'};cursor:pointer;\n          display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:all 0.15s;`;\n        checkBtn.textContent = isDone ? '✓' : '';\n        checkRow.appendChild(checkBtn);\n        wrapper.appendChild(checkRow);\n\n        const ta = document.createElement('textarea');\n        ta.className = 'sched-note';\n        ta.style.color = isDone ? 'var(--text-muted)' : color;\n        ta.style.borderColor = color + '30';\n        ta.style.textDecoration = isDone ? 'line-through' : 'none';\n        ta.placeholder = 'Notiz / Vorbereitung…';\n        ta.rows = 1;\n        ta.value = noteVal;\n        ta.addEventListener('input', () => {\n          schedNotes[nKey] = ta.value;\n          if (ta.value) delete noteCompleted[nKey];\n          saveAll();\n          autoResize(ta);\n          renderNextTask();\n          const btn = ev.querySelector('.note-open-btn');\n          if (ta.value) {\n            wrapper.style.display = 'block';\n            if (btn) btn.style.display = 'none';\n          } else {\n            wrapper.style.display = 'none';\n            if (btn) btn.style.display = '';\n          }\n        });\n        checkBtn.addEventListener('click', () => {\n          const nowDone = !noteCompleted[nKey];\n          if (nowDone) {\n            noteCompleted[nKey] = true;\n          } else {\n            delete noteCompleted[nKey];\n          }\n          saveAll();\n          renderNextTask();\n          // update visuals inline\n          checkBtn.textContent = nowDone ? '✓' : '';\n          checkBtn.style.background = nowDone ? color : 'none';\n          checkBtn.title = nowDone ? 'Wieder öffnen' : 'Als erledigt markieren';\n          ta.style.color = nowDone ? 'var(--text-muted)' : color;\n          ta.style.textDecoration = nowDone ? 'line-through' : 'none';\n        });\n        wrapper.appendChild(ta);\n        if (noteVal) setTimeout(() => autoResize(ta), 0);\n        eventsEl.appendChild(wrapper);\n\n        const openBtn = ev.querySelector('.note-open-btn');\n        if (openBtn) {\n          openBtn.addEventListener('click', (e) => {\n            e.stopPropagation();           // verhindert das Öffnen des Aktions-Menüs\n            wrapper.style.display = 'block';\n            openBtn.style.display = 'none';\n            autoResize(ta);\n            ta.focus();                    // Textfeld direkt aktiv\n          });\n        }\n      });\n\n      /* ── Exam chips for this day column ── */\n      const colDate = new Date(monday);\n      colDate.setDate(monday.getDate() + d);\n      colDate.setHours(0, 0, 0, 0);\n\n      const dayExams = exams.filter(ex => {\n        const ed = new Date(ex.date); ed.setHours(0,0,0,0);\n        return ed.getTime() === colDate.getTime();\n      });\n\n      if (dayExams.length > 0) {\n        const strip = document.createElement('div');\n        strip.className = 'sched-exam-strip';\n        dayExams.forEach(ex => {\n          const chip = document.createElement('div');\n          chip.className = 'sched-exam-chip';\n          chip.title = ex.subject + (ex.room ? ' · ' + ex.room : '') + (ex.time ? ' · ' + ex.time + ' Uhr' : '');\n          const timeLabel = ex.time ? `<span class=\"sched-exam-chip-time\">${ex.time}<\u002Fspan>` : '';\n          chip.innerHTML = `<span class=\"sched-exam-chip-dot\"><\u002Fspan>\n            <span class=\"sched-exam-chip-text\">${ex.subject}<\u002Fspan>${timeLabel}`;\n          strip.appendChild(chip);\n        });\n        // Insert strip at top of eventsEl so it always occupies its fixed height\n        eventsEl.insertBefore(strip, eventsEl.firstChild);\n      }\n    }\n\n    // \"Frühere Tage\"-Umschalter (nur aktuelle Woche im Hochformat sichtbar; CSS blendet ihn sonst aus)\n    const _isThisWeek   = monday.getTime() === getWeekMonday(0).getTime();\n    const _todayDow     = (new Date().getDay() + 6) % 7;\n    if (mode === 'current' && _isThisWeek && _todayDow > 0) {\n      const toggle = document.createElement('button');\n      toggle.className = 'past-toggle';\n      const setLabel = () => {\n        const shown = grid.classList.contains('show-past');\n        toggle.textContent = shown ? '↓ Frühere Tage ausblenden' : '↑ Frühere Tage';\n      };\n      setLabel();\n      toggle.addEventListener('click', (e) => {\n        e.stopPropagation();\n        grid.classList.toggle('show-past');\n        setLabel();\n      });\n      grid.appendChild(toggle);\n    }\n  }\n\n    /* ── Schedule modal ── */\n  let _editingSchedIdx   = -1;\n  let _evtSeriesIndices  = null; // null = Einzel-Edit; Array = Serien-Edit\n\n  function openSchedModal() {\n    _editingSchedIdx  = -1;\n    _evtSeriesIndices = null;\n    document.getElementById('schedModalTitle').textContent = '📚 Vorlesung eintragen';\n    document.getElementById('schedSaveBtn').textContent    = 'Eintrag speichern';\n    document.getElementById('schedModalOverlay').style.display = 'flex';\n    setTimeout(() => document.getElementById('s-course').focus(), 50);\n  }\n  function editSchedEntry(idx) {\n    const e = schedEntries[idx];\n    if (!e) return;\n    // _editingSchedIdx und _evtSeriesIndices werden vom Aufrufer gesetzt – hier nicht anfassen\n    document.getElementById('s-course').value   = e.course    || '';\n    document.getElementById('s-room').value     = e.room      || '';\n    document.getElementById('s-start').value    = e.startTime || '';\n    document.getElementById('s-end').value      = e.endTime   || '';\n    document.getElementById('s-day').value      = String(e.day);\n    document.getElementById('s-color').value    = e.color     || DEFAULT_SCHED_COLOR;\n    document.getElementById('s-colorPreview').style.background = e.color || DEFAULT_SCHED_COLOR;\n    document.getElementById('schedModalTitle').textContent =\n      _evtSeriesIndices ? '✏ Serie bearbeiten' : '✏ Eintrag bearbeiten';\n    document.getElementById('schedSaveBtn').textContent =\n      _evtSeriesIndices ? 'Alle speichern' : 'Änderungen speichern';\n    document.getElementById('schedModalOverlay').style.display = 'flex';\n    setTimeout(() => document.getElementById('s-course').focus(), 50);\n  }\n\n    function closeSchedModal() {\n    _editingSchedIdx  = -1;\n    _evtSeriesIndices = null;\n    document.getElementById('schedModalOverlay').style.display = 'none';\n    ['s-course','s-room','s-start','s-end'].forEach(id => document.getElementById(id).value = '');\n    document.getElementById('s-color').value = DEFAULT_SCHED_COLOR;\n    document.getElementById('s-colorPreview').style.background = DEFAULT_SCHED_COLOR;\n    document.getElementById('s-day').value = '0';\n  }\n  document.getElementById('schedModalOverlay').addEventListener('click', function(e) {\n    if (e.target === this) closeSchedModal();\n  });\n  document.getElementById('s-color').addEventListener('input', function() {\n    document.getElementById('s-colorPreview').style.background = this.value;\n  });\n\n  function addSchedEntry() {\n    const course = document.getElementById('s-course').value.trim();\n    if (!course) { document.getElementById('s-course').style.borderColor='var(--red)'; return; }\n    document.getElementById('s-course').style.borderColor='var(--border)';\n    const entry = {\n      day:       parseInt(document.getElementById('s-day').value),\n      course,\n      room:      document.getElementById('s-room').value.trim(),\n      startTime: document.getElementById('s-start').value,\n      endTime:   document.getElementById('s-end').value,\n      color:     document.getElementById('s-color').value,\n    };\n\n    if (_evtSeriesIndices && _evtSeriesIndices.length > 0) {\n      // Serien-Edit: Felder übernehmen, Wochentag jedes Eintrags beibehalten\n      _evtSeriesIndices.forEach(i => {\n        if (schedEntries[i]) {\n          schedEntries[i] = {\n            ...schedEntries[i],\n            course:    entry.course,\n            room:      entry.room,\n            startTime: entry.startTime,\n            endTime:   entry.endTime,\n            color:     entry.color,\n          };\n        }\n      });\n    } else if (_editingSchedIdx >= 0) {\n      // Vorhandene Zusatzfelder (z.B. _uid bei Sonderterminen) erhalten\n      schedEntries[_editingSchedIdx] = { ...schedEntries[_editingSchedIdx], ...entry };\n    } else {\n      schedEntries.push(entry);\n    }\n    saveAll();\n    refreshScheduleContent();\n    closeSchedModal();\n  }\n\n  /* ── Event Aktions-Modal ── */\n  let _evtIdx    = -1;  // schedEntries-Index\n  let _evtNKey   = '';  // noteKey des angeklickten Termins\n  let _evtMonday = null;\n  let _evtDay    = 0;\n\n  function showEvtChoice(idx, nKey, monday, day) {\n    _evtIdx    = idx;\n    _evtNKey   = nKey;\n    _evtMonday = monday;\n    _evtDay    = day;\n    const entry = schedEntries[idx];\n    const color = entry.color || DEFAULT_SCHED_COLOR;\n    document.getElementById('evtChoiceTitle').textContent = entry.course;\n    document.getElementById('evtChoiceSub').textContent   =\n      DAY_LONG[entry.day] +\n      (entry.startTime ? ' · ' + entry.startTime : '') +\n      (entry.room      ? ' · ' + entry.room      : '');\n    document.getElementById('evtColorBar').style.background = color;\n    document.getElementById('evtChoiceOverlay').style.display = 'flex';\n  }\n\n  function evtDoEdit() {\n    const idx = _evtIdx;\n    closeEvtChoice();\n    // Nur diesen einen Eintrag bearbeiten. Jeder schedEntry ist bereits eine\n    // wöchentliche Serie (wird für jede Woche gerendert), d.h. die Änderung gilt\n    // automatisch für denselben Termin in allen folgenden Wochen. Andere Termine\n    // desselben Fachs am selben Tag (eigene schedEntries mit anderer Uhrzeit)\n    // bleiben unberührt.\n    _evtSeriesIndices = null;\n    _editingSchedIdx  = idx;\n    editSchedEntry(idx);\n  }\n\n  // Findet den nächsten Termin (nach dem entfernten) mit gleichem Fach\n  function nextOccurrenceKey(course, fromMonday, fromDay) {\n    const startDate = new Date(fromMonday);\n    startDate.setDate(fromMonday.getDate() + fromDay);\n    startDate.setHours(0,0,0,0);\n    const cand = schedEntries\n      .map((e, i) => ({ e, i }))\n      .filter(x => x.e.course === course)\n      .sort((a, b) => a.e.day - b.e.day);\n    if (!cand.length) return null;\n    const wm = new Date(fromMonday);\n    for (let w = 0; w < 60; w++) {\n      for (const { e, i } of cand) {\n        const occ = new Date(wm);\n        occ.setDate(wm.getDate() + e.day);\n        occ.setHours(0,0,0,0);\n        if (occ.getTime() <= startDate.getTime()) continue;\n        const key = noteKey(wm, e.day, i);\n        if (removedSlots[key]) continue;\n        return key;\n      }\n      wm.setDate(wm.getDate() + 7);\n    }\n    return null;\n  }\n\n  function evtDoRemove() {\n    const idx = _evtIdx, nKey = _evtNKey, monday = _evtMonday, day = _evtDay;\n    closeEvtChoice();\n    const entry = schedEntries[idx];\n    // Diesen Termin an diesem Tag entfernen\n    removedSlots[nKey] = true;\n    // Hängt eine Notiz dran → zum nächsten Termin dieses Fachs übergeben\n    const note = schedNotes[nKey];\n    if (note && note.trim()) {\n      const done   = !!noteCompleted[nKey];\n      const target = nextOccurrenceKey(entry.course, monday, day);\n      if (target) {\n        schedNotes[target] = note;\n        if (done) noteCompleted[target] = true;\n      }\n    }\n    delete schedNotes[nKey];\n    delete noteCompleted[nKey];\n    saveAll();\n    refreshScheduleContent();\n    renderNextTask();\n  }\n\n  function closeEvtChoice() {\n    document.getElementById('evtChoiceOverlay').style.display = 'none';\n    _evtIdx    = -1;\n    _evtNKey   = '';\n    _evtMonday = null;\n  }\n  document.getElementById('evtChoiceOverlay').addEventListener('click', function(e) {\n    if (e.target === this) closeEvtChoice();\n  });\n\n\n  loadAll();\n  renderExams();\n  renderSchedule();\n  renderNextTask();\n\n\n\n  /* ══════════════════════════════════════\n     ICS IMPORT\n  ══════════════════════════════════════ */\n\n  let icsImportBuffer = []; // holds parsed unique entries pending confirmation\n\n  function triggerIcsImport() {\n    document.getElementById('icsFileInput').value = '';\n    document.getElementById('icsFileInput').click();\n  }\n\n  function handleIcsFile(evt) {\n    const file = evt.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = e => parseIcs(e.target.result);\n    reader.readAsText(file, 'UTF-8');\n  }\n\n  function parseIcs(text) {\n    // RFC 5545 line unfolding\n    text = text.replace(/\\r\\n[ \\t]/g, '').replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');\n\n    // ── Hilfsfunktionen ──────────────────────────────────────────\n    // Gibt den Wert einer Property zurück, inklusive Parameter (z.B. DTSTART;TZID=Europe/Berlin:...)\n    function getProp(block, key) {\n      const m = block.match(new RegExp('(?:^|\\\\n)' + key + '(?:;[^:\\\\n]*)?:([^\\\\n]+)', 'i'));\n      return m ? m[1].trim() : '';\n    }\n    function getAllProps(block, key) {\n      const re  = new RegExp('(?:^|\\\\n)' + key + '(?:;[^:\\\\n]*)?:([^\\\\n]+)', 'gi');\n      const out = [];\n      let m;\n      while ((m = re.exec(block)) !== null) out.push(m[1].trim());\n      return out;\n    }\n\n    // Parst einen iCal-Datumswert zu einem lokalen Date-Objekt\n    // Unterstützt: 20260423T140000Z  |  20260423T140000  |  20260423\n    function parseIcalDate(raw) {\n      if (!raw) return null;\n      const s = raw.replace(/[^\\dT]/g, ''); // strip non-digit/T chars (Z already removed if needed)\n      const isUTC = raw.endsWith('Z');\n      const year  = parseInt(s.slice(0,4));\n      const month = parseInt(s.slice(4,6)) - 1;\n      const day   = parseInt(s.slice(6,8));\n      if (s.length <= 8) {\n        // All-day: treat as local midnight\n        return new Date(year, month, day);\n      }\n      const h = parseInt(s.slice(9,11) || s.slice(8,10));\n      const m = parseInt(s.slice(11,13) || s.slice(10,12));\n      const sec = parseInt(s.slice(13,15) || s.slice(12,14)) || 0;\n      if (isUTC) return new Date(Date.UTC(year, month, day, h, m, sec));\n      return new Date(year, month, day, h, m, sec);\n    }\n\n    // Normalisiert einen Datumswert für Vergleiche (YYYYMMDD[THHMMSS])\n    function normalizeKey(raw) {\n      return raw.replace(/[^0-9T]/g, '').slice(0, 15);\n    }\n\n    // ── Alle VEVENT-Blöcke extrahieren ───────────────────────────\n    const blocks = [];\n    const evRe = /BEGIN:VEVENT([\\s\\S]*?)END:VEVENT/gi;\n    let em;\n    while ((em = evRe.exec(text)) !== null) blocks.push(em[1]);\n\n    // ── Erste Pass: UIDs und ihre EXDATE-Listen + RECURRENCE-IDs sammeln\n    const uidExdates    = {};  // uid → Set von normalisierten Datumsstrings\n    const uidRecIds     = {};  // uid → Set von normalisierten RECURRENCE-IDs\n    const uidHasRrule   = {};  // uid → bool\n\n    blocks.forEach(block => {\n      const uid = getProp(block, 'UID');\n      if (!uid) return;\n\n      if (getProp(block, 'RRULE')) uidHasRrule[uid] = true;\n\n      // EXDATE (kann mehrfach vorkommen, auch kommasepariert)\n      getAllProps(block, 'EXDATE').forEach(val => {\n        val.split(',').forEach(d => {\n          const k = normalizeKey(d);\n          if (k) {\n            if (!uidExdates[uid]) uidExdates[uid] = new Set();\n            uidExdates[uid].add(k.slice(0,8)); // nur Datum reicht zum Vergleich\n          }\n        });\n      });\n\n      // RECURRENCE-ID → dieser Block ist eine Ausnahme\n      const recId = getProp(block, 'RECURRENCE-ID');\n      if (recId) {\n        if (!uidRecIds[uid]) uidRecIds[uid] = new Set();\n        uidRecIds[uid].add(normalizeKey(recId).slice(0,8));\n      }\n    });\n\n    // ── Zweiter Pass: Events bauen ────────────────────────────────\n    const events = [];\n\n    blocks.forEach(block => {\n      const uid      = getProp(block, 'UID');\n      const summary  = getProp(block, 'SUMMARY').replace(/\\\\,/g,',').replace(/\\\\/g,'');\n      const location = getProp(block, 'LOCATION').replace(/\\\\/g,'');\n      const dtstart  = getProp(block, 'DTSTART');\n      const dtend    = getProp(block, 'DTEND');\n      const recId    = getProp(block, 'RECURRENCE-ID');\n      const rrule    = getProp(block, 'RRULE');\n      const status   = getProp(block, 'STATUS');\n\n      if (!dtstart || !summary) return;\n      if (status === 'CANCELLED') return;\n\n      const startDate = parseIcalDate(dtstart);\n      const endDate   = dtend ? parseIcalDate(dtend) : startDate;\n      if (!startDate) return;\n\n      const dateKey = dtstart.replace(/[^0-9]/g,'').slice(0,8);\n      const dow     = (startDate.getDay() + 6) % 7; // 0=Mo…4=Fr\n      if (dow > 4) return; // Wochenende überspringen\n\n      // EXDATE-Check: dieses Datum ist ausgeschlossen\n      if (uid && uidExdates[uid] && uidExdates[uid].has(dateKey)) return;\n\n      // Kursname säubern: \"RC 3 (3310)\" → \"RC 3\", Doppelungen entfernen\n      const courseName  = summary.replace(/\\s*\\(\\d+\\).*$/, '').trim();\n      const firstCourse = courseName.split(',')[0].trim();\n\n      const sh = String(startDate.getHours()).padStart(2,'0');\n      const sm = String(startDate.getMinutes()).padStart(2,'0');\n      const eh = String(endDate.getHours()).padStart(2,'0');\n      const eom = String(endDate.getMinutes()).padStart(2,'0');\n\n      // isOneOff: einzelner Sondertermin (hat RECURRENCE-ID)\n      const isException = !!recId;\n\n      events.push({\n        course:      firstCourse,\n        room:        location || '',\n        day:         dow,\n        startTime:   sh + ':' + sm,\n        endTime:     eh + ':' + eom,\n        isException,\n        _uid:        isException ? (uid + '|' + dateKey) : null, // eindeutige ID für Sondertermine\n        _dtstart:    dtstart,\n      });\n    });\n\n    // ── Deduplizieren ──────────────────────────────────────────────\n    // Sondertermine (isException) immer behalten, auch wenn Basis-Serie existiert\n    // Basis-Einträge: nur einmal pro course+day+startTime\n    const seen   = new Set();\n    const unique = [];\n    // Erst Ausnahmen, dann Basis-Einträge (damit Ausnahmen nie als Duplikat gelten)\n    const sorted = [...events].sort((a, b) => (b.isException ? 1 : 0) - (a.isException ? 1 : 0));\n    sorted.forEach(e => {\n      const key = e.isException\n        ? (e._uid || (e.course + '|' + e.day + '|' + e.startTime + '|exc'))\n        : (e.course + '|' + e.day + '|' + e.startTime);\n      if (!seen.has(key)) { seen.add(key); unique.push(e); }\n    });\n    unique.sort((a, b) => a.day - b.day || a.startTime.localeCompare(b.startTime));\n\n    if (unique.length === 0) {\n      alert('Keine Veranstaltungen in der Datei gefunden.');\n      return;\n    }\n\n    icsImportBuffer = unique;\n    renderIcsPreview(unique);\n    document.getElementById('icsModalOverlay').style.display = 'flex';\n  }\n\n  const DEFAULT_COLORS = ['#2F6BFF','#7C5CFF','#2FB36B','#F2853C','#0EA5B8','#FF5DA2','#E0A100','#E0539F'];\n\n  function renderIcsPreview(entries) {\n    const list = document.getElementById('icsPreviewList');\n    list.innerHTML = '';\n    entries.forEach((entry, i) => {\n      const color = DEFAULT_COLORS[i % DEFAULT_COLORS.length];\n      entry._color   = color;\n      entry._include = true;\n\n      const badge = entry.isException\n        ? '<span style=\"font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:rgba(200,86,42,0.15);color:#c8562a;border-radius:4px;padding:1px 5px;margin-left:6px;\">Sondertermin<\u002Fspan>'\n        : '';\n\n      const row = document.createElement('div');\n      row.style.cssText = 'display:flex;align-items:center;gap:10px;background:var(--inset);border:0.5px solid var(--border);border-radius:9px;padding:10px 12px;';\n      row.innerHTML = `\n        <input type=\"checkbox\" id=\"ics-chk-${i}\" checked style=\"width:15px;height:15px;accent-color:#5b8fc9;flex-shrink:0;cursor:pointer;\">\n        <div style=\"flex-shrink:0;width:3px;height:36px;border-radius:2px;background:${color};\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:13px;font-weight:500;color:var(--text-primary);display:flex;align-items:center;flex-wrap:wrap;gap:4px;\">${entry.course}${badge}<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text-muted);\">${DAY_LONG[entry.day]} · ${entry.startTime}–${entry.endTime} Uhr${entry.room ? ' · ' + entry.room : ''}<\u002Fdiv>\n        <\u002Fdiv>\n        <input type=\"color\" value=\"${color}\" title=\"Farbe wählen\"\n          style=\"width:28px;height:28px;padding:1px;border:0.5px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;flex-shrink:0;\"\n          onchange=\"icsImportBuffer[${i}]._color=this.value; this.previousElementSibling.previousElementSibling.previousElementSibling.style.background=this.value;\">\n      `;\n      row.querySelector('input[type=checkbox]').addEventListener('change', function() {\n        icsImportBuffer[i]._include = this.checked;\n        row.style.opacity = this.checked ? '1' : '0.4';\n      });\n      list.appendChild(row);\n    });\n  }\n\n  function confirmIcsImport() {\n    const toAdd = icsImportBuffer.filter(e => e._include);\n    if (toAdd.length === 0) { closeIcsModal(); return; }\n\n    toAdd.forEach(e => {\n      // Duplikat-Check: für Sondertermine nach _uid, sonst nach course+day+startTime\n      const exists = e._uid\n        ? schedEntries.some(s => s._uid === e._uid)\n        : schedEntries.some(s =>\n            !s._uid && s.course === e.course && s.day === e.day && s.startTime === e.startTime\n          );\n      if (!exists) {\n        const entry = {\n          course:    e.course,\n          room:      e.room,\n          day:       e.day,\n          startTime: e.startTime,\n          endTime:   e.endTime,\n          color:     e._color,\n        };\n        if (e._uid) entry._uid = e._uid; // Sondertermine behalten ihre UID\n        schedEntries.push(entry);\n      }\n    });\n\n    saveAll();\n    refreshScheduleContent();\n    closeIcsModal();\n  }\n\n  function closeIcsModal() {\n    document.getElementById('icsModalOverlay').style.display = 'none';\n    icsImportBuffer = [];\n  }\n\n  document.getElementById('icsModalOverlay').addEventListener('click', function(e) {\n    if (e.target === this) closeIcsModal();\n  });\n\n\n\n\n  /* ══════════════════════════════════════\n     NEXT TASK (from schedule notes)\n  ══════════════════════════════════════ */\n  function renderNextTask() {\n    const el = document.getElementById('nextTaskDisplay');\n    const monday     = getWeekMonday(0);\n    const nextMonday = getWeekMonday(1);\n    const now = new Date();\n    const todayDow = (now.getDay() + 6) % 7; // 0=Mon\n\n    // Collect open notes for a given week, tagged with their week monday\n    function collectWeek(weekMonday) {\n      const result = [];\n      schedEntries.forEach((entry, idx) => {\n        const nKey = noteKey(weekMonday, entry.day, idx);\n        if (removedSlots[nKey] || cancelledSlots[nKey]) return;\n        const text = schedNotes[nKey] || '';\n        if (!text.trim()) return;\n        if (noteCompleted[nKey]) return;\n        const date = new Date(weekMonday);\n        date.setDate(weekMonday.getDate() + entry.day);\n        const [h, m] = (entry.startTime || '00:00').split(':').map(Number);\n        date.setHours(h || 0, m || 0, 0, 0);\n        result.push({ entry, idx, nKey, text, date, weekMonday });\n      });\n      return result;\n    }\n\n    const thisCandidates = collectWeek(monday);\n    const nextCandidates = collectWeek(nextMonday);\n\n    // Sort each list\n    thisCandidates.sort((a, b) => a.date - b.date);\n    nextCandidates.sort((a, b) => a.date - b.date);\n\n    // Upcoming = this week from now onwards; if none, fall through to next week\n    const upcomingThis = thisCandidates.filter(c => c.date >= now);\n    let task = upcomingThis[0];\n    let isNextWeek = false;\n\n    if (!task) {\n      // Nothing upcoming this week — try next week\n      task = nextCandidates[0] || thisCandidates[0]; // next week first, then fallback to past\n      if (task && task.weekMonday.getTime() === nextMonday.getTime()) isNextWeek = true;\n    }\n\n    // All candidates for the \"remaining\" count\n    const allCandidates = [...thisCandidates, ...nextCandidates];\n\n    if (!task) {\n      const hasAny = Object.values(schedNotes).some(v => v && v.trim());\n      el.innerHTML = hasAny\n        ? `<div style=\"text-align:center;padding:1rem 0;font-size:18px;\">🎉<\u002Fdiv><div style=\"text-align:center;font-size:12px;color:var(--text-muted);\">Alle Aufgaben erledigt!<\u002Fdiv>`\n        : `<div style=\"text-align:center;padding:1rem 0;color:var(--text-muted);font-size:12px;line-height:1.6;\">Noch keine Notizen eingetragen.<br>Schreib in den Stundenplan,<br>was du für ein Fach vorbereiten musst.<\u002Fdiv>`;\n      return;\n    }\n\n    const color = task.entry.color || DEFAULT_SCHED_COLOR;\n    const dayLabel = DAY_LONG[task.entry.day];\n    const timeLabel = task.entry.startTime ? task.entry.startTime + ' Uhr' : '';\n\n    const taskDow = task.entry.day;\n    const isTodayTask = !isNextWeek && taskDow === todayDow;\n    let dateInfo;\n    if (isTodayTask) {\n      dateInfo = 'Heute' + (timeLabel ? ' · ' + timeLabel : '');\n    } else if (isNextWeek) {\n      dateInfo = 'Nächste Woche · ' + dayLabel + (timeLabel ? ' · ' + timeLabel : '');\n    } else {\n      dateInfo = dayLabel + (timeLabel ? ' · ' + timeLabel : '');\n    }\n\n    el.innerHTML = `\n      <div style=\"display:flex;align-items:flex-start;gap:10px;\">\n        <button onclick=\"completeNote('${task.nKey}')\" title=\"Als erledigt markieren\"\n          style=\"flex-shrink:0;margin-top:2px;width:18px;height:18px;border-radius:50%;\n                 border:1.5px solid ${color};background:none;cursor:pointer;transition:all 0.2s;\"\n          onmouseover=\"this.style.background='${color}33'\"\n          onmouseout=\"this.style.background='none'\">\n        <\u002Fbutton>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:11px;font-family:'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace;letter-spacing:0.05em;color:${color};margin-bottom:3px;\">${task.entry.course}  ·  ${dateInfo}<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text-primary);line-height:1.4;white-space:pre-wrap;\">${task.text}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n\n    // Remaining count across both weeks\n    const remaining = allCandidates.length;\n    if (remaining > 1) {\n      el.innerHTML += `<div style=\"margin-top:10px;font-size:11px;color:var(--text-muted);font-family:'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace;\">+${remaining - 1} weitere offene Aufgabe${remaining > 2 ? 'n' : ''}<\u002Fdiv>`;\n    }\n  }\n\n  function completeNote(nKey) {\n    noteCompleted[nKey] = true;\n    saveAll();\n    refreshScheduleContent();\n  }\n\n  function confirmResetAll() {\n    const ok = window.confirm(\n      'Alle Daten löschen?\\n\\nDas entfernt alle Klausurtermine, Stundenplaneinträge, Notizen und Erledigungen. Diese Aktion kann nicht rückgängig gemacht werden.'\n    );\n    if (!ok) return;\n    exams          = [];\n    schedEntries   = [];\n    schedNotes     = {};\n    noteCompleted  = {};\n    cancelledSlots = {};\n    removedSlots   = {};\n    // Aktuelle Keys + neuer Notiz-Key + alte Legacy-Keys (wh_*) restlos entfernen\n    [\n      'app_exams','app_schedule','app_notes','app_note_done','app_cancelled','app_removed',\n      'app_name','app_uni','app_accent','app_palette','app_darkmode','app_bgnote',\n      'wh_exams','wh_schedule','wh_notes','wh_note_done','wh_cancelled',\n      'wh_name','wh_uni','wh_accent','wh_darkmode'\n    ].forEach(lsRemove);\n    clearBgNote();\n    renderExams();\n    renderSchedule();\n    renderNextTask();\n  }\n\n  /* ── PDF Export ── */\n  function exportPDF() {\n    const pv = document.getElementById('printView');\n    const now = new Date();\n\n    // Echte Nutzerdaten + berechnetes Semester statt fester Werte\n    const pvName = (lsGet('app_name', '')).trim() || 'Unbekannt';\n    const pvUni  = (lsGet('app_uni',  '')).trim() || 'Meine Hochschule';\n    const pvSem  = getCurrentSemester().name;\n    let out = `\n      <h1>Dashboard — ${pvName}<\u002Fh1>\n      <div class=\"pv-meta\">Exportiert am ${now.toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'})} · ${now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})} Uhr &nbsp;·&nbsp; ${pvUni} · ${pvSem}<\u002Fdiv>\n    `;\n\n    // ── Stundenplan mit Notizen inline ──\n    const curMon = getWeekMonday(0);\n    out += `<h2>Stundenplan – KW ${isoWeek(curMon)}<\u002Fh2>`;\n    out += '<div class=\"pv-grid\">';\n    for (let d = 0; d < 5; d++) {\n      const date = new Date(curMon); date.setDate(curMon.getDate() + d);\n      const dayEntries = schedEntries\n        .map((e, i) => ({ ...e, idx: i }))\n        .filter(e => e.day === d)\n        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));\n      out += `<div class=\"pv-day\">\n        <div class=\"pv-day-hd\">\n          <span class=\"pv-day-name\">${DAY_SHORT[d]}<\u002Fspan>\n          <span class=\"pv-day-num\">${date.getDate()}<\u002Fspan>\n        <\u002Fdiv>`;\n      if (dayEntries.length === 0) {\n        out += '<div style=\"height:10px;\"><\u002Fdiv>';\n      } else {\n        dayEntries.forEach(e => {\n          const color  = e.color || DEFAULT_SCHED_COLOR;\n          const nKey   = noteKey(curMon, d, e.idx);\n          if (removedSlots[nKey] || cancelledSlots[nKey]) return;\n          const note   = schedNotes[nKey] || '';\n          const done   = !!noteCompleted[nKey];\n          out += `<div class=\"pv-event\" style=\"flex-direction:column;align-items:stretch;padding:5px 7px;gap:4px;\">\n            <div style=\"display:flex;align-items:flex-start;gap:6px;\">\n              <div class=\"pv-bar\" style=\"background:${color};margin-top:2px;\"><\u002Fdiv>\n              <div>\n                <div class=\"pv-event-name\" style=\"${done ? 'opacity:0.45;' : ''}\">${e.course}<\u002Fdiv>\n                ${e.room ? `<div class=\"pv-event-room\">${e.room}${e.startTime ? ' · ' + e.startTime : ''}<\u002Fdiv>` : ''}\n              <\u002Fdiv>\n            <\u002Fdiv>\n            ${note ? `<div style=\"margin-left:9px;font-size:10px;line-height:1.4;color:${done ? '#888' : color};white-space:pre-wrap;${done ? 'text-decoration:line-through;' : ''}\">${note.replace(/<\u002Fg,'&lt;')}<\u002Fdiv>` : ''}\n          <\u002Fdiv>`;\n        });\n      }\n      out += '<\u002Fdiv>';\n    }\n    out += '<\u002Fdiv>';\n\n    // ── Klausurtermine (ganz unten) ──\n    const sortedExams = [...exams].sort((a, b) => a.date - b.date);\n    out += '<h2 style=\"margin-top:32px;\">Klausurtermine<\u002Fh2>';\n    if (sortedExams.length === 0) {\n      out += '<p style=\"font-size:13px;color:#888;\">Keine Klausuren eingetragen.<\u002Fp>';\n    } else {\n      out += '<table><thead><tr><th>Datum<\u002Fth><th>Fach<\u002Fth><th>Uhrzeit<\u002Fth><th>Raum<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      sortedExams.forEach(e => {\n        const d = e.date;\n        out += `<tr>\n          <td>${d.getDate()}. ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}<\u002Ftd>\n          <td>${e.subject}<\u002Ftd>\n          <td>${e.time || '—'}<\u002Ftd>\n          <td>${e.room || '—'}<\u002Ftd>\n        <\u002Ftr>`;\n      });\n      out += '<\u002Ftbody><\u002Ftable>';\n    }\n\n    pv.innerHTML = out;\n\n    document.getElementById('lastExportLabel').textContent =\n      'Zuletzt exportiert: ' + now.toLocaleDateString('de-DE') + ' · ' + now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + ' Uhr';\n\n    window.print();\n  }\n\n  document.getElementById('lastUpdated').textContent =\n    `zuletzt geladen · ${new Date().toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'})}`;\n\n  /* ── Top Settings Panel Toggle ── */\n  let topSettingsOpen = false;\n  function toggleTopSettings() {\n    topSettingsOpen = !topSettingsOpen;\n    const panel  = document.getElementById('topSettingsPanel');\n    const gear   = document.getElementById('topSettingsGear');\n    const wrap   = document.getElementById('topbarWrap');\n    if (topSettingsOpen) {\n      panel.style.maxHeight = (panel.scrollHeight + 300) + 'px';\n      panel.style.opacity   = '1';\n      gear.style.color      = 'var(--accent)';\n      gear.style.transform  = 'rotate(60deg)';\n      wrap.classList.add('expanded');\n    } else {\n      panel.style.maxHeight = '0';\n      panel.style.opacity   = '0';\n      gear.style.color      = 'var(--text-muted)';\n      gear.style.transform  = 'rotate(0deg)';\n      wrap.classList.remove('expanded');\n    }\n  }\n\n  /* ── Dark Mode ── */\n  let dmSystemListener = null;\n\n  function applyDark(on) {\n    document.documentElement.classList.toggle('dark', on);\n    // Statusleisten-/Browser-Farbe an den tatsächlichen Modus angleichen\n    document.querySelectorAll('meta[name=\"theme-color\"]').forEach(m => {\n      m.setAttribute('content', on ? '#1a1714' : '#e8e3dc');\n    });\n  }\n\n  function updateDmButtons(mode) {\n    document.querySelectorAll('.dm-mode-btn').forEach(btn => {\n      btn.classList.toggle('active', btn.dataset.mode === mode);\n    });\n  }\n\n  function setDarkMode(mode) {\n    // Remove old system listener if switching away\n    if (dmSystemListener) {\n      window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change', dmSystemListener);\n      dmSystemListener = null;\n    }\n\n    if (mode === 'system') {\n      applyDark(window.matchMedia('(prefers-color-scheme: dark)').matches);\n      // Live-listen to OS changes\n      dmSystemListener = e => applyDark(e.matches);\n      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', dmSystemListener);\n      lsRemove('app_darkmode');\n    } else {\n      applyDark(mode === 'dark');\n      lsSet('app_darkmode', mode);\n    }\n    updateDmButtons(mode);\n  }\n\n  // Init: load saved mode or fall back to system\n  (function() {\n    let mode = 'system';\n    const saved = lsGet('app_darkmode');\n    if (saved === 'light' || saved === 'dark') mode = saved;\n    setDarkMode(mode);\n  })();\n\n  renderAccentSwatches();\n\n  /* ══════════════════════════════════════\n     SCHWEBENDES NOTIZ-PANEL\n     (Hintergrund-Klick öffnet/schließt; Fett, Farbe, Abhaken, Stichpunkte)\n  ══════════════════════════════════════ */\n  const bgPanel = document.getElementById('bgNotePanel');   // innere Karte\n  const bgWrap  = document.getElementById('bgNoteWrap');     // Aufklapp-Hülle\n  const bgList  = document.getElementById('bgNoteList');\n  let   bgItems = [];   // [{html, done}]\n\n  function bgNoteLoad() {\n    try { const raw = lsGet('app_bgnote'); bgItems = raw ? JSON.parse(raw) : []; }\n    catch(e) { bgItems = []; }\n    if (!Array.isArray(bgItems) || bgItems.length === 0) bgItems = [{ html:'', done:false }];\n  }\n  function bgNoteSave() { lsSet('app_bgnote', JSON.stringify(bgItems)); }\n\n  function bgNoteRender(focusObj) {\n    // Markierte Notizen stabil nach oben sortieren (mehrere möglich)\n    bgItems.sort((a, b) => (b.flagged ? 1 : 0) - (a.flagged ? 1 : 0));\n    bgList.innerHTML = '';\n    bgItems.forEach((it, idx) => {\n      const row = document.createElement('div');\n      row.className = 'bgnote-item' + (it.done ? ' done' : '') + (it.flagged ? ' flagged' : '');\n\n      const flag = document.createElement('button');     // Markier-Symbol (vor dem Kästchen)\n      flag.className = 'bgnote-flag';\n      flag.textContent = it.flagged ? '⚑' : '⚐';\n      flag.title = it.flagged ? 'Markierung entfernen' : 'Für heute markieren';\n      flag.addEventListener('click', () => {\n        bgItems[idx].flagged = !bgItems[idx].flagged;\n        bgNoteSave(); bgNoteRender(bgItems[idx]);\n      });\n\n      const box = document.createElement('div');     // Kästchen zum Abhaken\n      box.className = 'bgnote-check';\n      box.title = 'Abhaken';\n      box.addEventListener('click', () => { bgItems[idx].done = !bgItems[idx].done; bgNoteSave(); bgNoteRender(); });\n\n      const line = document.createElement('div');     // editierbare Stichpunkt-Zeile\n      line.className = 'bgnote-line';\n      line.contentEditable = 'true';\n      line.dataset.ph = idx === 0 ? 'Notiz schreiben…' : '';\n      line.innerHTML = it.html || '';\n      line.dataset.idx = idx;\n      line.addEventListener('input', () => { bgItems[idx].html = line.innerHTML; bgNoteSave(); bgNoteAdjust(); });\n      line.addEventListener('keydown', (e) => bgNoteKey(e, idx, line));\n\n      row.appendChild(flag); row.appendChild(box); row.appendChild(line);\n      bgList.appendChild(row);\n\n      // Cursor in die gewünschte Zeile setzen (nach Enter/Backspace/Markieren)\n      if (focusObj && it === focusObj) {\n        setTimeout(() => {\n          line.focus();\n          const r = document.createRange(); r.selectNodeContents(line); r.collapse(false);\n          const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);\n        }, 0);\n      }\n    });\n    bgNoteAdjust();\n  }\n\n  // Enter = neue Zeile/Stichpunkt, Backspace am Anfang einer leeren Zeile = löschen\n  function bgNoteKey(e, idx, line) {\n    if (e.key === 'Enter') {\n      e.preventDefault();\n      bgItems[idx].html = line.innerHTML;\n      const newItem = { html:'', done:false, flagged:false };\n      bgItems.splice(idx + 1, 0, newItem);\n      bgNoteSave(); bgNoteRender(newItem);\n    } else if (e.key === 'Backspace' && line.textContent === '' && bgItems.length > 1) {\n      e.preventDefault();\n      const target = idx > 0 ? bgItems[idx - 1] : bgItems[idx + 1];\n      bgItems.splice(idx, 1);\n      bgNoteSave(); bgNoteRender(target);\n    }\n  }\n\n  // ── Auswahl merken/wiederherstellen (Safari verliert die Markierung beim\n  //    Öffnen des Farbwählers / beim Klick auf Werkzeuge) ──\n  let bgNoteRange = null;\n  function bgNoteLineOf(node) {\n    while (node && node.nodeType !== 1) node = node.parentNode;\n    return node && node.closest ? node.closest('.bgnote-line') : null;\n  }\n  function bgNoteRememberSelection() {\n    const sel = window.getSelection();\n    if (sel && sel.rangeCount && bgNoteLineOf(sel.getRangeAt(0).commonAncestorContainer)) {\n      bgNoteRange = sel.getRangeAt(0).cloneRange();\n    }\n  }\n  function bgNoteRestoreSelection() {\n    const sel = window.getSelection();\n    if (sel && sel.rangeCount && bgNoteLineOf(sel.getRangeAt(0).commonAncestorContainer)) {\n      return sel.getRangeAt(0);\n    }\n    if (bgNoteRange) {\n      const line = bgNoteLineOf(bgNoteRange.commonAncestorContainer);\n      if (line && document.contains(line)) {\n        line.focus();\n        sel.removeAllRanges(); sel.addRange(bgNoteRange);\n        return bgNoteRange;\n      }\n    }\n    return null;\n  }\n\n  // Fett auf die aktuelle Auswahl anwenden\n  function bgNoteBold() {\n    const r = bgNoteRestoreSelection();\n    if (!r) return;\n    document.execCommand('bold');\n    bgNoteSyncActive(); bgNoteFlush();\n  }\n\n  // Schriftfarbe robust per Range-API setzen (kein execCommand → zuverlässig in Safari).\n  // 'auto' = Schwarz/Weiß je nach Modus, 'accent' = aktuelle Akzentfarbe, sonst Hex.\n  function bgNoteColor(value) {\n    const range = bgNoteRestoreSelection();\n    if (!range) return;\n    const line = bgNoteLineOf(range.commonAncestorContainer);\n    if (!line) return;\n\n    const span = document.createElement('span');\n    if (value === 'auto')        span.className = 'note-auto';\n    else if (value === 'accent') span.style.color = currentAccentHex;\n    else                         span.style.color = value;\n\n    const sel = window.getSelection();\n    if (range.collapsed) {\n      // Keine Auswahl → leeren farbigen Span anlegen, nachfolgender Text erbt die Farbe\n      span.appendChild(document.createTextNode('\\u200B'));\n      range.insertNode(span);\n      const r = document.createRange(); r.setStart(span.firstChild, 1); r.collapse(true);\n      sel.removeAllRanges(); sel.addRange(r);\n      bgNoteRange = r.cloneRange();\n    } else {\n      const frag = range.extractContents();\n      span.appendChild(frag);\n      range.insertNode(span);\n      const r = document.createRange(); r.selectNodeContents(span);\n      sel.removeAllRanges(); sel.addRange(r);\n      bgNoteRange = r.cloneRange();\n    }\n    const i = +line.dataset.idx;\n    if (bgItems[i]) { bgItems[i].html = line.innerHTML; bgNoteSave(); }\n  }\n  window.bgNoteRememberSelection = bgNoteRememberSelection;\n\n  function bgNoteFlush() {\n    const el = document.activeElement;\n    if (el && el.classList && el.classList.contains('bgnote-line')) {\n      bgItems[+el.dataset.idx].html = el.innerHTML; bgNoteSave();\n    }\n  }\n  function bgNoteSyncActive() {\n    const b = document.querySelector('.bgnote-tool.b');\n    if (b) b.classList.toggle('active', !!(document.queryCommandState && document.queryCommandState('bold')));\n  }\n  // Aktuelle Auswahl innerhalb einer Notizzeile dauerhaft merken\n  document.addEventListener('selectionchange', () => {\n    const sel = window.getSelection();\n    if (sel && sel.rangeCount && bgNoteLineOf(sel.getRangeAt(0).commonAncestorContainer)) {\n      bgNoteRange = sel.getRangeAt(0).cloneRange();\n      bgNoteSyncActive();\n    }\n  });\n\n  // Höhe der Aufklapp-Hülle an den Inhalt anpassen (für saubere Animation)\n  function bgNoteAdjust() {\n    if (bgWrap.classList.contains('open')) bgWrap.style.maxHeight = bgWrap.scrollHeight + 'px';\n  }\n  function openBgNote() {\n    bgWrap.classList.add('open');\n    bgWrap.style.maxHeight = bgWrap.scrollHeight + 'px';\n    const first = bgList.querySelector('.bgnote-line');\n    if (first) first.focus();\n  }\n  function closeBgNote() { bgWrap.classList.remove('open'); bgWrap.style.maxHeight = '0px'; }\n  function toggleBgNote(){ bgWrap.classList.contains('open') ? closeBgNote() : openBgNote(); }\n  function clearBgNote() { bgItems = [{ html:'', done:false, flagged:false }]; bgNoteSave(); bgNoteRender(); }\n  window.closeBgNote = closeBgNote; window.clearBgNote = clearBgNote;\n  window.bgNoteBold = bgNoteBold;  window.bgNoteColor = bgNoteColor;\n\n  // Klick in den Hintergrund (kein Kasten/Element) öffnet/schließt den Notizkasten\n  function isMobilePortrait() {\n    return window.matchMedia && window.matchMedia('(max-width:600px) and (orientation:portrait)').matches;\n  }\n  document.addEventListener('click', (e) => {\n    if (isMobilePortrait()) return;   // auf Mobile immer sichtbar – kein Toggle\n    if (e.target.closest('#bgNotePanel, .nm-raised, .card, .modal-card, button, input, textarea, select, label, [contenteditable], a')) return;\n    const onBg = e.target === document.body || e.target.classList.contains('layout');\n    if (onBg) toggleBgNote();\n  });\n  window.addEventListener('resize', bgNoteAdjust);\n\n  bgNoteLoad();\n  bgNoteRender();\n\n  /* ══════════════════════════════════════\n     CLOUD SYNC (Google Firebase Firestore)\n     Zugangsdaten nur im localStorage – nie im Code.\n     Nutzt die Firestore REST API – kein SDK nötig.\n  ══════════════════════════════════════ */\n\n  function getSyncConfig() {\n    const apiKey    = lsGet('sync_apikey', '');\n    const projectId = lsGet('sync_projectid', '');\n    const uid       = lsGet('sync_uid', '');\n    return (apiKey && projectId && uid) ? { apiKey, projectId, uid } : null;\n  }\n\n  /* Firestore REST Basis-URL */\n  function _fsUrl(cfg) {\n    return `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/dashboard/${encodeURIComponent(cfg.uid)}?key=${cfg.apiKey}`;\n  }\n\n  function updateSyncStatusLabel() {\n    const cfg = getSyncConfig();\n    const lbl = document.getElementById('syncStatusLabel');\n    const btn = document.getElementById('syncNowBtn');\n    if (!lbl) return;\n    if (cfg) {\n      lbl.textContent = 'Aktiv · Firebase · ID: ' + cfg.uid;\n      lbl.style.color = 'var(--green)';\n      if (btn) btn.style.display = 'inline-flex';\n    } else {\n      lbl.textContent = 'Nicht konfiguriert';\n      lbl.style.color = '';\n      if (btn) btn.style.display = 'none';\n    }\n  }\n\n  function openSyncModal() {\n    const cfg = getSyncConfig();\n    if (cfg) {\n      document.getElementById('sync-apikey').value    = cfg.apiKey;\n      document.getElementById('sync-projectid').value = cfg.projectId;\n      document.getElementById('sync-uid').value       = cfg.uid;\n      document.getElementById('syncClearBtn').style.display = 'block';\n    } else {\n      document.getElementById('syncClearBtn').style.display = 'none';\n    }\n    document.getElementById('syncTestResult').textContent = '';\n    document.getElementById('syncModalOverlay').style.display = 'flex';\n  }\n  function closeSyncModal() {\n    document.getElementById('syncModalOverlay').style.display = 'none';\n  }\n  document.getElementById('syncModalOverlay').addEventListener('click', function(e) {\n    if (e.target === this) closeSyncModal();\n  });\n\n  function saveSyncConfig() {\n    const apiKey    = document.getElementById('sync-apikey').value.trim();\n    const projectId = document.getElementById('sync-projectid').value.trim();\n    const uid       = document.getElementById('sync-uid').value.trim();\n    if (!apiKey || !projectId || !uid) {\n      document.getElementById('syncTestResult').textContent = '⚠ Bitte alle Felder ausfüllen.';\n      document.getElementById('syncTestResult').style.color = 'var(--red)';\n      return;\n    }\n    lsSet('sync_apikey',    apiKey);\n    lsSet('sync_projectid', projectId);\n    lsSet('sync_uid',       uid);\n    updateSyncStatusLabel();\n    document.getElementById('syncClearBtn').style.display = 'block';\n    document.getElementById('syncTestResult').textContent = '✓ Gespeichert. Lade Cloud-Daten…';\n    document.getElementById('syncTestResult').style.color = 'var(--green)';\n    syncLoad().then(() => closeSyncModal());\n  }\n\n  function clearSyncConfig() {\n    if (!window.confirm('Sync-Konfiguration entfernen? Deine lokalen Daten bleiben erhalten.')) return;\n    lsRemove('sync_apikey'); lsRemove('sync_projectid'); lsRemove('sync_uid');\n    updateSyncStatusLabel();\n    closeSyncModal();\n  }\n\n  async function testSyncConnection() {\n    const apiKey    = document.getElementById('sync-apikey').value.trim();\n    const projectId = document.getElementById('sync-projectid').value.trim();\n    const uid       = document.getElementById('sync-uid').value.trim();\n    const res       = document.getElementById('syncTestResult');\n    res.textContent = '…Verbinde mit Firebase';\n    res.style.color = 'var(--text-muted)';\n    if (!apiKey || !projectId || !uid) {\n      res.textContent = '⚠ Felder ausfüllen.'; res.style.color = 'var(--red)'; return;\n    }\n    try {\n      const cfg = { apiKey, projectId, uid };\n      // GET: Dokument lesen (404 = noch nicht vorhanden, aber Verbindung OK)\n      const r = await fetch(_fsUrl(cfg));\n      if (r.ok || r.status === 404) {\n        res.textContent = '✓ Firebase erreichbar' + (r.status === 404 ? ' (noch kein Datensatz – wird beim ersten Speichern angelegt)' : '');\n        res.style.color = 'var(--green)';\n      } else {\n        const body = await r.json().catch(() => ({}));\n        res.textContent = '✕ Fehler ' + r.status + ': ' + (body?.error?.message || r.statusText);\n        res.style.color = 'var(--red)';\n      }\n    } catch(e) {\n      res.textContent = '✕ Netzwerkfehler: ' + e.message;\n      res.style.color = 'var(--red)';\n    }\n  }\n\n  /* ── Firestore-Wert-Wrapper (REST API erwartet typisierte Felder) ── */\n  function _toFs(obj) {\n    // Speichert das gesamte Payload als einzelnen JSON-String im stringValue-Feld\n    return { fields: { payload: { stringValue: JSON.stringify(obj) } } };\n  }\n  function _fromFs(doc) {\n    try { return JSON.parse(doc.fields.payload.stringValue); }\n    catch(e) { return null; }\n  }\n\n  /* ── Upload ── */\n  async function syncSave() {\n    const cfg = getSyncConfig();\n    if (!cfg) return;\n    const payload = {\n      exams:     JSON.parse(lsGet('app_exams',     '[]')),\n      schedule:  JSON.parse(lsGet('app_schedule',  '[]')),\n      notes:     JSON.parse(lsGet('app_notes',     '{}')),\n      note_done: JSON.parse(lsGet('app_note_done', '{}')),\n      cancelled: JSON.parse(lsGet('app_cancelled', '{}')),\n      bgnote:    JSON.parse(lsGet('app_bgnote',    '[]')),\n    };\n    try {\n      await fetch(_fsUrl(cfg), {\n        method: 'PATCH',   // PATCH = upsert in Firestore REST\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(_toFs(payload)),\n      });\n      _updateSyncTime();\n    } catch(e) { /* offline – lokal bereits gespeichert */ }\n  }\n\n  /* ── Download ── */\n  async function syncLoad() {\n    const cfg = getSyncConfig();\n    if (!cfg) return;\n    try {\n      const r = await fetch(_fsUrl(cfg));\n      if (r.status === 404) return; // noch kein Datensatz\n      if (!r.ok) return;\n      const doc = await r.json();\n      const d = _fromFs(doc);\n      if (!d) return;\n      if (d.exams)     lsSet('app_exams',     JSON.stringify(d.exams));\n      if (d.schedule)  lsSet('app_schedule',  JSON.stringify(d.schedule));\n      if (d.notes)     lsSet('app_notes',     JSON.stringify(d.notes));\n      if (d.note_done) lsSet('app_note_done', JSON.stringify(d.note_done));\n      if (d.cancelled) lsSet('app_cancelled', JSON.stringify(d.cancelled));\n      if (d.bgnote)    lsSet('app_bgnote',    JSON.stringify(d.bgnote));\n      loadAll();\n      renderExams();\n      refreshScheduleContent();\n      bgNoteLoad(); bgNoteRender();\n      _updateSyncTime();\n    } catch(e) { /* offline */ }\n  }\n\n  function _updateSyncTime() {\n    const t = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});\n    const lbl = document.getElementById('lastUpdated');\n    if (lbl) lbl.textContent = 'synced · ' + t;\n  }\n\n  async function syncNow() {\n    const btn = document.getElementById('syncNowBtn');\n    if (btn) btn.textContent = '…';\n    await syncLoad();\n    if (btn) btn.textContent = '↕ Jetzt synchronisieren';\n  }\n\n  /* ── saveAll & bgNoteSave patchen ── */\n  const _origSaveAll = saveAll;\n  window.saveAll = function() { _origSaveAll(); syncSave(); };\n  const _origBgNoteSave = bgNoteSave;\n  window.bgNoteSave = function() { _origBgNoteSave(); syncSave(); };\n\n  /* ── Beim Start ── */\n  updateSyncStatusLabel();\n  syncLoad();\n\n  /* ── Mobil: Pinch-/Doppeltipp-Zoom verhindern (iOS Safari ignoriert user-scalable=no) ── */\n  (function preventZoom() {\n    // Pinch-Geste (iOS Safari)\n    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(ev) {\n      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });\n    });\n    // Doppeltipp-Zoom: zweiten Tipp innerhalb 300 ms unterbinden\n    let lastTouch = 0;\n    document.addEventListener('touchend', function(e) {\n      const now = Date.now();\n      if (now - lastTouch <= 300) e.preventDefault();\n      lastTouch = now;\n    }, { passive: false });\n    // Zwei-Finger-Zoom über touchmove zusätzlich abfangen\n    document.addEventListener('touchmove', function(e) {\n      if (e.touches && e.touches.length > 1) e.preventDefault();\n    }, { passive: false });\n  })();\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
